name: Install site

# Publishes site/ (the step-by-step install guide) to the gh-pages branch, served at
# https://mxhddd.github.io/Memory-App/. Runs for the default branch, release tags, or by hand.
# One-time switch if the page isn't live: Settings → Pages → Deploy from a branch → gh-pages / (root).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["site/**", "distribution/icon.png", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp distribution/icon.png site/icon.png
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name=memory-garden-bot -c user.email=actions@users.noreply.github.com commit -qm "Install site from $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "::notice::Install guide pushed to gh-pages. If https://mxhddd.github.io/Memory-App/ isn't live, open Settings → Pages → Deploy from a branch → gh-pages / (root) → Save (once)."

      - name: Is the page live?
        run: |
          sleep 60
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mxhddd.github.io/Memory-App/ || true)
          if [ "$code" = "200" ]; then echo "Live: https://mxhddd.github.io/Memory-App/"
          else echo "::warning::Pages answered $code. Turn on GitHub Pages once: Settings → Pages → Deploy from a branch → gh-pages / (root)."; fi
