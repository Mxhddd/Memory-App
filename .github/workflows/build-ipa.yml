name: Build iOS app

# Builds an unsigned MemoryGarden.ipa on a GitHub-hosted Mac (no Mac needed at home).
#  * push to an app path  → compile check + IPA artifact
#  * tag v1.2.3           → also publishes to the public releases repo for SideStore
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["App/**", "Widgets/**", "Shared/**", "Packages/**", "project.yml", "distribution/**", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASES_REPO: mxhddd/memory-garden-releases

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: brew install xcodegen ldid

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build IPA
        env:
          MG_VERSION: ${{ steps.v.outputs.version }}
          MG_BUILD: ${{ github.run_number }}
        run: ./distribution/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MemoryGarden-${{ steps.v.outputs.version }}
          path: build/MemoryGarden.ipa
          retention-days: 14

      - name: Publish to releases repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the RELEASES_TOKEN secret (see docs/INSTALL.md)"; exit 1; fi
          gh release create "v$VERSION" build/MemoryGarden.ipa --repo "$RELEASES_REPO" --title "Memory Garden $VERSION" --notes "Install or update from SideStore."
          git clone "https://x-access-token:$GH_TOKEN@github.com/$RELEASES_REPO.git" releases
          SIZE=$(stat -f%z build/MemoryGarden.ipa)
          python3 distribution/update_source.py distribution/sidestore-source.json releases/sidestore-source.json \
            "$VERSION" "$GITHUB_RUN_NUMBER" "$SIZE" "https://github.com/$RELEASES_REPO/releases/download/v$VERSION/MemoryGarden.ipa" \
            "https://raw.githubusercontent.com/$RELEASES_REPO/main/icon.png"
          cp distribution/icon.png releases/icon.png
          cd releases
          git config user.name "memory-garden-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "Memory Garden $VERSION" && git push
