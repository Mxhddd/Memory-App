name: Build iOS app

# Builds an unsigned MemoryGarden.ipa on a GitHub-hosted Mac (no Mac needed at home).
#  * push to an app path  → compile check + IPA artifact
#  * tag v1.2.3, or Run workflow with "Publish a release" ticked
#                         → also publishes a GitHub release in this repo with the IPA, the
#                           SideStore source (stable link: releases/latest/download/sidestore-source.json),
#                           the icon and the Windows setup helper. Uses the built-in token: no secrets.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["App/**", "Widgets/**", "Shared/**", "Packages/MemoryCore/**", "project.yml", "distribution/**", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (version from project.yml MARKETING_VERSION)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen & ldid
        run: brew install xcodegen ldid

      - name: Version
        id: v
        run: |
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; PUBLISH=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]]; then
            V=$(awk -F'"' '/MARKETING_VERSION:/ {print $2; exit}' project.yml); PUBLISH=true
          else V="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $V (publish: $PUBLISH)"

      - name: Build IPA
        env:
          MG_VERSION: ${{ steps.v.outputs.version }}
          MG_BUILD: ${{ github.run_number }}
        run: ./distribution/build-ipa.sh

      - name: Show what the app asks for
        run: |
          APP=build/MemoryGarden.xcarchive/Products/Applications/MemoryGarden.app
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          ldid -e "$APP/$EXE" > build/app-entitlements.plist
          echo "App entitlements:"; cat build/app-entitlements.plist
          echo "Widget entitlements:"; ldid -e "$APP/PlugIns/MemoryGardenWidgets.appex/MemoryGardenWidgets"
          if grep -q "time-sensitive\|aps-environment\|com.apple.developer.siri\|icloud" build/app-entitlements.plist; then
            echo "::error::The app asks for an entitlement a free Apple ID can't grant"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MemoryGarden-${{ steps.v.outputs.version }}
          path: build/MemoryGarden.ipa
          retention-days: 14

      - name: Publish the release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases"
          APP=build/MemoryGarden.xcarchive/Products/Applications/MemoryGarden.app
          # Keep earlier versions in the source's history (none yet on the first release).
          curl -fsSL "$BASE/latest/download/sidestore-source.json" -o build/previous-source.json || echo "No earlier source"
          python3 distribution/update_source.py --template distribution/sidestore-source.json \
            --previous build/previous-source.json --out build/sidestore-source.json \
            --version "$VERSION" --build "$GITHUB_RUN_NUMBER" --ipa build/MemoryGarden.ipa \
            --ipa-url "$BASE/download/v$VERSION/MemoryGarden.ipa" --icon-url "$BASE/latest/download/icon.png" \
            --info-plist "$APP/Info.plist" --entitlements build/app-entitlements.plist \
            --notes "$(head -1 distribution/release-notes.md | sed 's/^# *//')"
          cp distribution/icon.png build/icon.png
          (cd distribution/windows && zip -q ../../build/MemoryGarden-Windows-Setup.zip Setup-MemoryGarden.cmd Setup-MemoryGarden.ps1)
          ASSETS="build/MemoryGarden.ipa build/sidestore-source.json build/icon.png build/MemoryGarden-Windows-Setup.zip"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" $ASSETS --repo "$GITHUB_REPOSITORY" --clobber   # re-run: replace the files
          else
            # Creates the tag on this commit too when the run was started with "Publish a release".
            gh release create "v$VERSION" $ASSETS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Memory Garden $VERSION" --notes-file distribution/release-notes.md --latest
          fi

      - name: Check the download links
        if: steps.v.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          BASE="https://github.com/$GITHUB_REPOSITORY/releases"
          for url in "$BASE/latest/download/sidestore-source.json" "$BASE/latest/download/icon.png" "$BASE/download/v$VERSION/MemoryGarden.ipa"; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url"); echo "$code $url"
            [ "$code" = "200" ] || { echo "::error::$url answered $code"; exit 1; }
          done
          curl -fsSL "$BASE/latest/download/sidestore-source.json" | python3 -c "import json,sys; d=json.load(sys.stdin); v=d['apps'][0]['versions'][0]; assert v['version']=='$VERSION', v; print('Source serves', v['version'])"
