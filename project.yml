# XcodeGen spec — run `xcodegen generate` on your Mac (brew install xcodegen), then open MemoryGarden.xcodeproj.
# Free Apple ID friendly: exactly ONE app extension (widgets + Live Activity), because SideStore's
# free-account limit is 3 app IDs per phone (SideStore + this app + this extension).
name: MemoryGarden
options:
  bundleIdPrefix: com.mxhddd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set to your Personal Team ID in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
    # Change this if Xcode says the bundle ID is taken (free teams need a globally unique ID).
    APP_BUNDLE_ID: com.mxhddd.memorygarden
    APP_GROUP_ID: group.com.mxhddd.memorygarden
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
packages:
  MemoryCore:
    path: Packages/MemoryCore
targets:
  MemoryGarden:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
      - path: Shared
    dependencies:
      - package: MemoryCore
      - target: MemoryGardenWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: MemoryGarden
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Memory Garden
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Memory Garden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts: [PixelifySans-SemiBold.ttf, CormorantGaramond-SemiBold.ttf]
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: Memory Garden uses alarms only for reminders you set yourself, so they can ring even when your phone is on silent.
        NSPhotoLibraryUsageDescription: Add a photo to a memory card (e.g. a relative's face). Photos stay on this phone.
        ITSAppUsesNonExemptEncryption: false
        # SideStore/AltStore rewrite app-group IDs for free accounts and record the real ones here.
        ALTAppGroups: [$(APP_GROUP_ID)]
        MGAppGroupID: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: memorygarden
            CFBundleURLSchemes: [memorygarden]
        # Lets the app open SideStore to refresh its signature.
        LSApplicationQueriesSchemes: [sidestore]
        # Background refresh (free capability) rolls widgets, the Live Activity and reminders over at midnight.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mxhddd.memorygarden.dayrollover]
    entitlements:
      path: App/MemoryGarden.entitlements
      properties:
        # Only capabilities a free Apple ID can sign: App Groups (shared with the widget extension).
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  MemoryGardenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/Design/Theme.swift
      - path: App/Design/PixelSpriteView.swift
      - path: App/Design/Shapes.swift
      - path: App/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: MemoryCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        PRODUCT_NAME: MemoryGardenWidgets
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Memory Garden
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [PixelifySans-SemiBold.ttf, CormorantGaramond-SemiBold.ttf]
        ALTAppGroups: [$(APP_GROUP_ID)]
        MGAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/MemoryGardenWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

schemes:
  MemoryGarden:
    build:
      targets:
        MemoryGarden: all
        MemoryGardenWidgets: all
    run:
      config: Debug
    archive:
      config: Release
